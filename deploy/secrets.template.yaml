# kube-log-mcp Secrets Template
#
# This file documents all required secrets for the Slack ChatOps agent.
# DO NOT commit this file with real values. Copy it, fill in the values,
# and apply with: kubectl apply -f secrets.yaml
#
# To create base64-encoded values:
#   echo -n "your-token-here" | base64
#
# Required tokens:
#
#   slack-bot-token:
#     The Bot User OAuth Token from your Slack App (starts with xoxb-).
#     Required scopes: app_mentions:read, chat:write, reactions:write,
#                      channels:history, groups:history, im:history
#
#   slack-app-token:
#     The App-Level Token with connections:write scope (starts with xapp-).
#     Enables Socket Mode — no public URL or webhook endpoint needed.
#
#   anthropic-api-key:
#     Your Anthropic API key (starts with sk-ant-).
#     Used to call the Claude API for LLM reasoning.
#
apiVersion: v1
kind: Secret
metadata:
  name: kube-log-mcp-secrets
  namespace: prod
type: Opaque
data:
  # Replace these base64-encoded placeholders with your actual tokens:
  #   echo -n "xoxb-your-bot-token" | base64
  slack-bot-token: "REPLACE_WITH_BASE64_ENCODED_SLACK_BOT_TOKEN"
  #   echo -n "xapp-your-app-token" | base64
  slack-app-token: "REPLACE_WITH_BASE64_ENCODED_SLACK_APP_TOKEN"
  #   echo -n "sk-ant-your-api-key" | base64
  anthropic-api-key: "REPLACE_WITH_BASE64_ENCODED_ANTHROPIC_API_KEY"
