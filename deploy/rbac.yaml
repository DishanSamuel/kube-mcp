apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-log-mcp-sa
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-log-mcp-role
  namespace: prod
rules:
  # Allow reading basic pod information and logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Allow reading deployment status/info
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Allow reading events related to deployments/pods
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-log-mcp-rolebinding
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: kube-log-mcp-sa
    namespace: prod
roleRef:
  kind: Role
  name: kube-log-mcp-role
  apiGroup: rbac.authorization.k8s.io
